plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gikoko.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gikoko.studio'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
